<!doctype html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Editar usuario | Admin Luz de Plata
  </title>
  <link href="../css/estilos.css" rel="stylesheet"/>
  <link href="../css/admin.css" rel="stylesheet"/>
 </head>
 <body class="admin-body" data-page="usuario-editar">
  <div class="admin-shell">
   <aside class="admin-sidebar">
    <a class="admin-brand" href="index.html">
     Luz de Plata
     <br/>
     <small>
      Administración
     </small>
    </a>
    <nav class="admin-menu">
     <a href="index.html">
      Inicio
     </a>
     <a href="productos.html">
      Productos
     </a>
     <a href="ordenes.html">
      Órdenes
     </a>
     <a data-admin-only="" href="producto-nuevo.html">
      Nuevo producto
     </a>
     <a class="activo" data-admin-only="" href="usuarios.html">
      Usuarios
     </a>
     <a data-admin-only="" href="usuario-nuevo.html">
      Nuevo usuario
     </a>
    </nav>
    <div class="admin-sidebar__pie">
     <a class="boton boton--claro" href="../index.html">
      Ver tienda
     </a>
     <button class="boton boton--suave" data-admin-logout="">
      Cerrar sesión
     </button>
    </div>
   </aside>
   <main class="admin-main">
    <header class="admin-topbar">
     <strong>
      Editar usuario
     </strong>
     <span data-admin-user="">
     </span>
    </header>
    <section class="admin-contenido">
     <h1>
      Editar usuario
     </h1>
     <form class="admin-card formulario form-grid" id="usuario-form" novalidate="">
      <div class="campo">
       <label for="admin-run">
        RUN *
       </label>
       <input id="admin-run" maxlength="9" name="run" placeholder="123456785" required=""/>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo">
       <label for="admin-name">
        Nombre *
       </label>
       <input autocomplete="given-name" id="admin-name" maxlength="50" name="name" required=""/>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo">
       <label for="admin-surname">
        Apellidos *
       </label>
       <input autocomplete="family-name" id="admin-surname" maxlength="100" name="surname" required=""/>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo">
       <label for="admin-email">
        Correo *
       </label>
       <input autocomplete="email" id="admin-email" maxlength="100" name="email" required="" type="email"/>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo">
       <label for="admin-birth">
        Fecha nacimiento
       </label>
       <input autocomplete="bday" id="admin-birth" name="birth" type="date"/>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo">
       <label for="admin-role">
        Tipo de usuario *
       </label>
       <select id="admin-role" name="role" required="">
        <option value="">
         Selecciona
        </option>
        <option>
         Administrador
        </option>
        <option>
         Cliente
        </option>
        <option>
         Vendedor
        </option>
       </select>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo">
       <label for="admin-region">
        Región *
       </label>
       <select id="admin-region" name="region" required="">
       </select>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo">
       <label for="admin-commune">
        Comuna *
       </label>
       <select id="admin-commune" name="commune" required="">
       </select>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo campo--completo">
       <label for="admin-address">
        Dirección *
       </label>
       <input autocomplete="street-address" id="admin-address" maxlength="300" name="address" required=""/>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo">
       <label for="admin-password">
        Contraseña *
       </label>
       <input autocomplete="new-password" id="admin-password" maxlength="10" minlength="4" name="password" type="password"/>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo">
       <label for="admin-confirmPassword">
        Confirmar contraseña *
       </label>
       <input autocomplete="new-password" id="admin-confirmPassword" maxlength="10" minlength="4" name="confirmPassword" type="password"/>
       <span class="error-campo">
       </span>
      </div>
      <div class="campo campo--completo form-acciones">
       <button class="boton" type="submit">
        Guardar cambios
       </button>
       <a class="boton boton--claro" href="usuarios.html">
        Cancelar
       </a>
      </div>
     </form>
    </section>
   </main>
  </div>
  <script src="../js/storage.js">
  </script>
  <script src="../js/regiones-comunas.js">
  </script>
  <script src="../js/validaciones.js">
  </script>
  <script src="../js/productos.js">
  </script>
  <script src="../js/usuarios.js">
  </script>
  <script src="../js/admin.js">
  </script>
 </body>
</html>
