spring.application.name=luz-de-plata-backend

# Servidor
server.port=${SERVER_PORT:8080}

# MySQL: los valores se pueden configurar mediante variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/luz_de_plata?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:luz_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Mensajes de error
server.error.include-message=always
